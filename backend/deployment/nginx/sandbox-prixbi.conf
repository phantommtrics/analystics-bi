# PrixBI frontend + API on sandbox-prixbi.phantommetrics.gm
#
# - /api/*  → Node backend (port 4000)
# - /       → frontend static build (/var/www/prixbi)
#
# Build frontend: npm run build  (from frontend/, uses .env.production)
# Deploy guide: backend/deployment/nginx/DEPLOY.md

server {
    listen 80;
    listen [::]:80;
    server_name sandbox-prixbi.phantommetrics.gm;

    client_max_body_size 15M;

    root /var/www/prixbi;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: after Certbot, copy the location blocks above into the 443 server block
# Certbot creates, or run:
#   sudo certbot --nginx -d sandbox-prixbi.phantommetrics.gm
#
# If Certbot already configured HTTPS, merge these locations into that block
# (do not leave `location / { proxy_pass ... }` pointing everything at Node).
